# Единая точка входа: админка на /, API и вебхуки Telegram на /api.
# TLS терминируется здесь; certbot добавит 443-й server-блок автоматически.

upstream ai_sales_api {
    server api:4000;
    keepalive 16;
}

upstream ai_sales_web {
    server web:3000;
    keepalive 16;
}

limit_req_zone $binary_remote_addr zone=api_zone:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=webhook_zone:10m rate=40r/s;

server {
    listen 80;
    server_name _;

    client_max_body_size 6m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Вебхук Telegram: отдельный лимит, длинных таймаутов не нужно —
    # приложение отвечает 200 сразу и обрабатывает апдейт в фоне.
    location /api/v1/webhooks/ {
        limit_req zone=webhook_zone burst=40 nodelay;
        proxy_pass http://ai_sales_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 20s;
    }

    location /api/ {
        limit_req zone=api_zone burst=40 nodelay;
        proxy_pass http://ai_sales_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 70s;
    }

    location /health {
        proxy_pass http://ai_sales_api;
        access_log off;
    }

    location / {
        proxy_pass http://ai_sales_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
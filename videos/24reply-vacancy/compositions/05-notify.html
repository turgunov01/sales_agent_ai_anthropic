      <script>
        (function () {
          function split(el) {
            const text = el.textContent;
            el.textContent = "";
            const out = [];
            for (const c of text) {
              const s = document.createElement("span");
              s.className = "ch";
              s.textContent = c;
              el.appendChild(s);
              out.push(s);
            }
            return out;
          }
          function type(tl, spans, start, cps, caret, keepCaret) {
            const step = 1 / cps;
            spans.forEach((s, i) => {
              const t = start + i * step;
              tl.set(s, { opacity: 1, boxShadow: "0.09em 0 0 " + caret }, t);
              if (i < spans.length - 1 || !keepCaret) tl.set(s, { boxShadow: "0 0 0 transparent" }, t + step);
            });
            return start + spans.length * step;
          }
          function typeSel(tl, sel, start, cps, caret, keep) {
            return type(tl, split(document.querySelector(sel)), start, cps, caret, keep);
          }

          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#s5-head", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.05);

          tl.to("#s5-ok", { scale: 0.9, duration: 0.1 }, 3.0);
          tl.to("#s5-ok", { scale: 1, backgroundColor: "#0f5c56", borderColor: "#0f5c56", duration: 0.2 }, 3.1);
          tl.fromTo("#s5-chip", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3 }, 3.25);

          window.__timelines["s5-notify"] = tl;
        })();

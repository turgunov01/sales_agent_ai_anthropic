      <script>
        (function () {
          function split(el) {
            const text = el.textContent;
            el.textContent = "";
            const out = [];
            for (const c of text) {
              const s = document.createElement("span");
              s.className = "ch";
              s.textContent = c;
              el.appendChild(s);
              out.push(s);
            }
            return out;
          }
          function type(tl, spans, start, cps, caret, keepCaret) {
            const step = 1 / cps;
            spans.forEach((s, i) => {
              const t = start + i * step;
              tl.set(s, { opacity: 1, boxShadow: "0.09em 0 0 " + caret }, t);
              if (i < spans.length - 1 || !keepCaret) tl.set(s, { boxShadow: "0 0 0 transparent" }, t + step);
            });
            return start + spans.length * step;
          }
          function typeSel(tl, sel, start, cps, caret, keep) {
            return type(tl, split(document.querySelector(sel)), start, cps, caret, keep);
          }

          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#s3-sheet", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0);
          tl.fromTo("#s3-ava", { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(1.8)" }, 0.25);
          tl.fromTo("#s3-tag", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.35);
          let t = typeSel(tl, "#s3-name", 0.5, 16, "#1f3a5f", false);
          tl.fromTo("#s3-pos", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3 }, t + 0.1);
          tl.fromTo("#s3-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power2.inOut" }, t + 0.25);
          let rt = 1.75;
          for (let i = 1; i <= 5; i++) {
            tl.fromTo("#s3-r" + i + " .rs-k", { opacity: 0 }, { opacity: 1, duration: 0.2 }, rt);
            const end = typeSel(tl, "#s3-v" + i, rt + 0.15, 22, "#0f5c56", i === 5);
            rt = Math.max(end + 0.25, rt + 0.95);
          }
          tl.fromTo("#s3-quote", { opacity: 0, y: 40, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.5)" }, rt + 0.2);

          window.__timelines["s3-resume"] = tl;
        })();
      </script>

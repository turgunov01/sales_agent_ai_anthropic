          inset: 0;

      <div id="root" data-composition-id="s1-vacancy" data-width="1080" data-height="1920">
        <div id="s1-sheet">
          <div id="s1-tag">ВАКАНСИЯ № 24</div>
          <span id="s1-rule"></span>
          <h1 id="s1-head">Ищем менеджера по продажам</h1>
          <div id="s1-req-title">Требования:</div>
          <div class="s1-req" id="s1-r1">— отвечать ночью</div>
          <div class="s1-req" id="s1-r2">— не путать цены</div>
          <div class="s1-req" id="s1-r3">— без отпусков</div>
        </div>
      </div>

      <script>
        (function () {
          function split(el) {
            const text = el.textContent;
            el.textContent = "";
            const out = [];
            for (const c of text) {
              const s = document.createElement("span");
              s.className = "ch";
              s.textContent = c;
              el.appendChild(s);
              out.push(s);
            }
            return out;
          }
          function type(tl, spans, start, cps, caret, keepCaret) {
            const step = 1 / cps;
            spans.forEach((s, i) => {
              const t = start + i * step;
              tl.set(s, { opacity: 1, boxShadow: "0.09em 0 0 " + caret }, t);
              if (i < spans.length - 1 || !keepCaret) tl.set(s, { boxShadow: "0 0 0 transparent" }, t + step);
            });
            return start + spans.length * step;
          }
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#s1-sheet", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 0);
          tl.fromTo("#s1-tag", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.1);
          tl.fromTo("#s1-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.inOut" }, 0.15);
          let t = type(tl, split(document.querySelector("#s1-head")), 0.35, 20, "#1f3a5f", false);
          tl.fromTo("#s1-req-title", { opacity: 0 }, { opacity: 1, duration: 0.25 }, t + 0.25);
          t = type(tl, split(document.querySelector("#s1-r1")), t + 0.55, 17, "#0f5c56", false);
          t = type(tl, split(document.querySelector("#s1-r2")), t + 0.3, 17, "#0f5c56", false);
          t = type(tl, split(document.querySelector("#s1-r3")), t + 0.3, 17, "#0f5c56", true);
          tl.to("#s1-sheet", { scale: 1.03, duration: 7 - t, ease: "none" }, t);
          window.__timelines["s1-vacancy"] = tl;
        })();
      </script>

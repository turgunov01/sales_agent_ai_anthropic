      <script>
        (function () {
          function split(el) {
            const text = el.textContent;
            el.textContent = "";
            const out = [];
            for (const c of text) {
              const s = document.createElement("span");
              s.className = "ch";
              s.textContent = c;
              el.appendChild(s);
              out.push(s);
            }
            return out;
          }
          function type(tl, spans, start, cps, caret, keepCaret) {
            const step = 1 / cps;
            spans.forEach((s, i) => {
              const t = start + i * step;
              tl.set(s, { opacity: 1, boxShadow: "0.09em 0 0 " + caret }, t);
              if (i < spans.length - 1 || !keepCaret) tl.set(s, { boxShadow: "0 0 0 transparent" }, t + step);
            });
            return start + spans.length * step;
          }
          function typeSel(tl, sel, start, cps, caret, keep) {
            return type(tl, split(document.querySelector(sel)), start, cps, caret, keep);
          }

          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#s6-stamp", { scale: 2.6, rotation: -4, opacity: 0 }, { scale: 1, rotation: -11, opacity: 1, duration: 0.28, ease: "power4.in" }, 0.45);
          tl.fromTo("#s6-sheet", { y: 0 }, { y: 12, duration: 0.06, repeat: 3, yoyo: true, ease: "none" }, 0.73);
          let t = typeSel(tl, "#s6-l1", 1.15, 28, "#1f3a5f", false);
          t = typeSel(tl, "#s6-l2", t + 0.15, 30, "#0f5c56", false);
          typeSel(tl, "#s6-l3", t + 0.1, 26, "#0f5c56", true);

          window.__timelines["s6-hired"] = tl;
        })();
